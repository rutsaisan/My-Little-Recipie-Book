<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Grano de papel: ruido fractal teñido de marrón cacao (#583623) muy suave. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.345  0 0 0 0 0.212  0 0 0 0 0.137  0 0 0 0.55 -0.18" />
  </filter>
  <rect width="240" height="240" filter="url(#grain)" />
</svg>
