<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Trama de lino para el mantel y la tela de la portada (fibras horizontales y verticales). -->
  <filter id="linen" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="3" stitchTiles="stitch" result="h" />
    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="v" />
    <feBlend in="h" in2="v" mode="multiply" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.306  0 0 0 0 0.184  0 0 0 0 0.129  0 0 0 0.9 -0.32" />
  </filter>
  <rect width="320" height="320" filter="url(#linen)" />
</svg>
